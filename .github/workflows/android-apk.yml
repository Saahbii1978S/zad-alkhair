name: Build Zad Alkhair Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web app
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Zad Alkhair launcher icon
        run: |
          python3 -m pip install --quiet cairosvg pillow
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image

          source = Path("icon.svg")
          if not source.exists():
              raise SystemExit("icon.svg is missing; cannot create the app launcher icon")

          rendered = Path("/tmp/zad-alkhair-icon.png")
          cairosvg.svg2png(url=str(source), write_to=str(rendered), output_width=512, output_height=512)
          image = Image.open(rendered).convert("RGBA")

          root = Path("android/app/src/main/res")
          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in densities.items():
              target = root / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = image.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(target / "ic_launcher.png", optimize=True)
              icon.save(target / "ic_launcher_round.png", optimize=True)

          # Use the branded PNGs on all Android versions instead of Capacitor's
          # generic adaptive foreground/background launcher artwork.
          adaptive = root / "mipmap-anydpi-v26"
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              file = adaptive / name
              if file.exists():
                  file.unlink()
          print("Installed branded Zad Alkhair launcher icons for all Android densities.")
          PY

      - name: Add Android notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          marker = '    <application'
          permissions = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n'
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace(marker, permissions + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install audio conversion tool
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg is already available on the GitHub runner."
          else
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install native full adhan service
        run: python3 scripts/install-android-adhan.py

      # Skip the separate debug build; the signed release build below is the deliverable.

      - name: Check release signing secrets
        id: signing_check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release signing
        if: ${{ steps.signing_check.outputs.enabled == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/zad-alkhair-release.jks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          raw = os.environ["ANDROID_KEYSTORE_BASE64"].strip().lstrip("\\ufeff")
          raw = re.sub(r"^data:[^,]*;base64,", "", raw, flags=re.IGNORECASE)
          raw = raw.strip().strip('"').strip("'")
          raw = raw.replace("\\r", "").replace("\\n", "").replace("\\t", "")
          raw = raw.replace("-", "+").replace("_", "/")
          # Remove harmless copy/paste separators (spaces, bullets, punctuation).
          # The decoded keystore is still verified by keytool immediately below.
          alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
          compact = "".join(ch for ch in raw if ch in alphabet)
          # Padding is not data: rebuild it from the normalized payload so
          # copied line-wraps or misplaced '=' characters cannot break decoding.
          remainder = len(compact) % 4
          if remainder == 1:
              raise SystemExit(
                  "ANDROID_KEYSTORE_BASE64 has an invalid normalized length "
                  f"(characters={len(compact)}, remainder={remainder}); "
                  "the secret appears truncated or contains a missing Base64 character."
              )
          padded = compact + ("=" * ((4 - remainder) % 4))
          try:
              decoded = base64.b64decode(padded, validate=True)
          except Exception as exc:
              raise SystemExit(
                  "ANDROID_KEYSTORE_BASE64 decoding failed after safe normalization "
                  f"(characters={len(compact)}, remainder={remainder}, error={type(exc).__name__})."
              )

          import io
          import zipfile

          # Some backups encode the ZIP container rather than the JKS file itself.
          if decoded.startswith(b"PK\x03\x04"):
              with zipfile.ZipFile(io.BytesIO(decoded)) as archive:
                  candidates = [n for n in archive.namelist() if n.lower().endswith((".jks", ".keystore", ".p12", ".pfx"))]
                  if not candidates:
                      raise SystemExit("Decoded ZIP does not contain a recognized Android keystore file.")
                  decoded = archive.read(candidates[0])

          if len(decoded) < 100:
              raise SystemExit("Decoded keystore is unexpectedly small; refusing to use it.")
          if decoded.startswith(bytes.fromhex("feedfeed")):
              store_type = "JKS"
          elif decoded.startswith(b"0"):
              store_type = "PKCS12"
          else:
              raise SystemExit(
                  "Decoded data is not a recognized JKS/PKCS12 keystore "
                  f"(bytes={len(decoded)}, header={decoded[:4].hex()})."
              )
          Path(os.environ["ANDROID_KEYSTORE_PATH"]).write_bytes(decoded)
          Path("/tmp/zad-alkhair-keystore-type").write_text(store_type, encoding="ascii")
          print(f"Decoded keystore safely ({len(decoded)} bytes; format={store_type}); secret content was not printed.")
          PY
          export ANDROID_KEYSTORE_TYPE="$(cat /tmp/zad-alkhair-keystore-type)"
          echo "ANDROID_KEYSTORE_TYPE=$ANDROID_KEYSTORE_TYPE" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text(encoding='utf-8')
          if 'signingConfigs {' not in s:
              block = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storeType System.getenv("ANDROID_KEYSTORE_TYPE")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              '''
              s = s.replace('android {', 'android {' + block, 1)
          if 'signingConfig signingConfigs.release' not in s:
              start = s.index('buildTypes {')
              pos = s.index('release {', start)
              s = s[:pos] + s[pos:].replace('release {', 'release {\n            signingConfig signingConfigs.release', 1)
          p.write_text(s, encoding='utf-8')
          PY
          echo "Checking decoded keystore and configured alias (no passwords will be printed)."
          ls -l "$ANDROID_KEYSTORE_PATH"
          keytool -list -storetype "$ANDROID_KEYSTORE_TYPE" -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS"

      - name: Build signed release APK and Play Store bundle
        if: ${{ steps.signing_check.outputs.enabled == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/zad-alkhair-release.jks
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload signed release APK and AAB
        if: ${{ steps.signing_check.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: zad-alkhair-signed-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Prepare signed direct APK download
        if: ${{ steps.signing_check.outputs.enabled == 'true' }}
        run: cp android/app/build/outputs/apk/release/app-release.apk zad-alkhair.apk

      - name: Publish signed APK as the direct download
        if: ${{ steps.signing_check.outputs.enabled == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Zad Alkhair - Latest APK
          body: "آخر نسخة APK موقعة من تطبيق زاد الخير. حمّل الملف وثبّته على هاتف Android."
          files: zad-alkhair.apk
          overwrite_files: true
          make_latest: true

      - name: Remove temporary signing key
        if: always()
        run: rm -f android/app/zad-alkhair-release.jks
