name: Build Zad Alkhair Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web app
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Zad Alkhair launcher icon
        run: |
          python3 -m pip install --quiet cairosvg pillow
          python3 - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image

          source = Path("icon.svg")
          if not source.exists():
              raise SystemExit("icon.svg is missing; cannot create the app launcher icon")

          rendered = Path("/tmp/zad-alkhair-icon.png")
          cairosvg.svg2png(url=str(source), write_to=str(rendered), output_width=512, output_height=512)
          image = Image.open(rendered).convert("RGBA")

          root = Path("android/app/src/main/res")
          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in densities.items():
              target = root / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = image.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(target / "ic_launcher.png", optimize=True)
              icon.save(target / "ic_launcher_round.png", optimize=True)

          # Use the branded PNGs on all Android versions instead of Capacitor's
          # generic adaptive foreground/background launcher artwork.
          adaptive = root / "mipmap-anydpi-v26"
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              file = adaptive / name
              if file.exists():
                  file.unlink()
          print("Installed branded Zad Alkhair launcher icons for all Android densities.")
          PY

      - name: Add Android notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          marker = '    <application'
          permissions = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n'
          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace(marker, permissions + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install audio conversion tool
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install native full adhan service
        run: python3 scripts/install-android-adhan.py

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zad-alkhair-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Debug APK is retained only as a private workflow artifact.
      # Never publish an unsigned/debug APK as the public direct download.

      - name: Check release signing secrets
        id: signing_check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release signing
        if: ${{ steps.signing_check.outputs.enabled == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/zad-alkhair-release.jks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          raw = os.environ["ANDROID_KEYSTORE_BASE64"].strip().lstrip("\\ufeff")
          raw = re.sub(r"^data:[^,]*;base64,", "", raw, flags=re.IGNORECASE)
          raw = raw.strip().strip('"').strip("'")
          compact = re.sub(r"\\s+", "", raw).replace("-", "+").replace("_", "/")
          compact += "=" * ((4 - len(compact) % 4) % 4)
          try:
              decoded = base64.b64decode(compact, validate=True)
          except Exception:
              invalid = sorted(set(ch for ch in compact if ch not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="))
              raise SystemExit(
                  "ANDROID_KEYSTORE_BASE64 is not clean Base64. "
                  f"Length after whitespace cleanup: {len(compact)}; "
                  f"invalid character count: {len(invalid)}. "
                  "Update the secret using the Base64 file contents only."
              )
          if len(decoded) < 100:
              raise SystemExit("Decoded keystore is unexpectedly small; refusing to use it.")
          Path(os.environ["ANDROID_KEYSTORE_PATH"]).write_bytes(decoded)
          print(f"Decoded keystore file safely ({len(decoded)} bytes); secret content was not printed.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text(encoding='utf-8')
          if 'signingConfigs {' not in s:
              block = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              '''
              s = s.replace('android {', 'android {' + block, 1)
          if 'signingConfig signingConfigs.release' not in s:
              start = s.index('buildTypes {')
              pos = s.index('release {', start)
              s = s[:pos] + s[pos:].replace('release {', 'release {\n            signingConfig signingConfigs.release', 1)
          p.write_text(s, encoding='utf-8')
          PY
          echo "Checking decoded keystore and configured alias (no passwords will be printed)."
          ls -l "$ANDROID_KEYSTORE_PATH"
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS"

      - name: Build signed release APK and Play Store bundle
        if: ${{ steps.signing_check.outputs.enabled == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/zad-alkhair-release.jks
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload signed release APK and AAB
        if: ${{ steps.signing_check.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: zad-alkhair-signed-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Prepare signed direct APK download
        if: ${{ steps.signing_check.outputs.enabled == 'true' }}
        run: cp android/app/build/outputs/apk/release/app-release.apk zad-alkhair.apk

      - name: Publish signed APK as the direct download
        if: ${{ steps.signing_check.outputs.enabled == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Zad Alkhair - Latest APK
          body: "آخر نسخة APK موقعة من تطبيق زاد الخير. حمّل الملف وثبّته على هاتف Android."
          files: zad-alkhair.apk
          overwrite_files: true
          make_latest: true

      - name: Remove temporary signing key
        if: always()
        run: rm -f android/app/zad-alkhair-release.jks
